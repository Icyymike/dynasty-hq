name: Record ring fixtures
on:
  push:
    branches: [redraft-fixtures]
    paths: ['tools/ring.txt']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          DYN=ring RECORD_DIR=fx5 python pipeline/build.py > fx5_log.txt 2>&1 || true
          tail -30 fx5_log.txt
          tar czf fx5.tgz fx5 fx5_log.txt && ls -la fx5.tgz
          git config user.name "dynasty-hq-bot"; git config user.email "actions@users.noreply.github.com"
          git add fx5.tgz; git commit -m "ring fixtures"; git push
