name: Game day (keeps refreshing during games)
# GitHub's scheduler often skips runs on busy Sundays. This workflow only needs ONE of its starts to fire:
# it then refreshes every 20 minutes until the night's games are over, and restarts itself before
# GitHub's 6-hour job limit. Extra starts while it's running just wait in line and exit quickly.
on:
  schedule:
    - cron: "13,43 15-20 * * 0"   # Sunday from ~11am ET: several backup starts
    - cron: "13,43 22,23 * * 1,4" # Monday and Thursday evening
    - cron: "13 0,1 * * 1,2,5"    # backup starts during night games
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: cache
          key: sleeper-cache-${{ github.run_id }}
          restore-keys: sleeper-cache-
      - name: Refresh every 20 minutes until the games are over
        run: |
          python3 - > window_end.txt <<'PY'
          import datetime as dt
          n = dt.datetime.now(dt.timezone.utc); wd, h = n.weekday(), n.hour   # Monday=0 ... Sunday=6
          def at(days, hh, mm): return int((n.replace(hour=hh, minute=mm, second=0, microsecond=0) + dt.timedelta(days=days)).timestamp())
          if wd == 6 and h >= 15: print(at(1, 4, 45))              # Sunday games through Sunday night
          elif wd in (0, 1, 4) and h < 5: print(at(0, 4, 45))      # night game still going (after midnight UTC)
          elif wd in (0, 3) and h >= 22: print(at(1, 4, 45))       # Monday / Thursday night game
          else: print(0)
          PY
          END=$(cat window_end.txt); START=$(date +%s)
          if [ "$END" = "0" ]; then echo "No games right now."; exit 0; fi
          while true; do
            git pull -q --rebase --autostash origin main || true
            bash scripts/refresh_once.sh
            NOW=$(date +%s)
            if [ $NOW -ge $END ]; then echo "Games are over."; break; fi
            if [ $((NOW - START)) -ge 19800 ]; then   # 5.5 hours in: hand over to a fresh run
              gh workflow run gameday.yml --ref main && echo "Handed over to a new run."; break
            fi
            sleep 1200
          done
