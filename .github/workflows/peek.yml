name: Peek redraft league
on:
  push:
    paths: ['.github/workflows/peek.yml']
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p redraft_peek
          L=1355031586092883968
          curl -s https://api.sleeper.app/v1/league/$L > redraft_peek/league.json
          curl -s https://api.sleeper.app/v1/league/$L/users > redraft_peek/users.json
          curl -s https://api.sleeper.app/v1/league/$L/rosters > redraft_peek/rosters.json
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add redraft_peek; git commit -m "peek redraft league" && git pull --rebase -q && git push
