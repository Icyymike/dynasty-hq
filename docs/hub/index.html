<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Leagues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#14212b; --muted:#5b6b78; --line:#d9e0e6;
  --accent:#0076b6; --s1:#0076b6; --s2:#c46a1a; --accent-soft:#e3f0f8; --silver:#a5acaf;
  --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c2402f; --bad-soft:#f8e4e1; --warn:#b7791f; --warn-soft:#f7eedb;
  --f-display:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --panel:#15212b; --ink:#e6edf2; --muted:#93a3b0; --line:#25343f;
  --accent:#3aa0e0; --s1:#2f93d1; --s2:#d07e33; --accent-soft:#16324a; --silver:#7d878c;
  --good:#46c07a; --good-soft:#163525; --bad:#ec6f5c; --bad-soft:#3d1d19; --warn:#e0a84a; --warn-soft:#3a2d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c; --panel:#15212b; --ink:#e6edf2; --muted:#93a3b0; --line:#25343f;
  --accent:#3aa0e0; --s1:#2f93d1; --s2:#d07e33; --accent-soft:#16324a; --silver:#7d878c;
  --good:#46c07a; --good-soft:#163525; --bad:#ec6f5c; --bad-soft:#3d1d19; --warn:#e0a84a; --warn-soft:#3a2d14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.board{background:#0a1117}}
:root[data-theme="dark"] header.board{background:#0a1117}
.board-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand h1 span{color:#5cb8ea}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1px solid rgba(255,255,255,.22);border-radius:3px;color:#dfe8ee;white-space:nowrap}
.chip b{color:#fff;font-weight:500}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:#9fb3c1;padding:8px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#5cb8ea}
nav.tabs button:focus-visible{outline:2px solid #5cb8ea;outline-offset:-2px}
main section{display:flex;flex-direction:column;gap:16px;padding-top:18px}
h2{font-family:var(--f-display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0}
.lede{color:var(--muted);max-width:68ch;margin:4px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
select,input[type=search]{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--panel);color:var(--muted);padding:5px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:4px;padding:6px 12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pick-list{display:flex;flex-direction:column;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:4px}
.pick-list label{display:grid;grid-template-columns:18px 30px 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.pick-list label:last-child{border-bottom:0}
.pick-list label:has(input:checked){background:var(--accent-soft)}
.pos{font-family:var(--f-mono);font-size:11px;font-weight:500;text-align:center;border-radius:3px;padding:1px 0;color:#fff}
.pos.QB{background:#7a4fb3}.pos.RB{background:#1f8a7a}.pos.WR{background:#0076b6}.pos.TE{background:#c46a1a}.pos.PK{background:var(--silver)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stat .s{font-size:12px;color:var(--muted)}
.pos-v{color:var(--good)}.neg-v{color:var(--bad)}
.verdict{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;padding:6px 12px;border-radius:4px}
.v-win{background:var(--good-soft);color:var(--good)}.v-bad{background:var(--bad-soft);color:var(--bad)}.v-mid{background:var(--warn-soft);color:var(--warn)}.v-info{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}
.t-core{background:var(--good-soft);color:var(--good)}.t-depth{background:var(--accent-soft);color:var(--accent)}.t-exp{background:var(--warn-soft);color:var(--warn)}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap;cursor:default}
th.sortable{cursor:pointer}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
td.r,th.r{text-align:right}
tr.hl td{background:var(--accent-soft)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.note{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;max-width:80ch}
.deal{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:6px}
.deal .sides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.deal .arrow{color:var(--muted);font-family:var(--f-mono)}
.needbar{display:grid;grid-template-columns:28px 1fr 46px;gap:6px;align-items:center;font-size:12px}
.needbar .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.needbar .bar i{display:block;height:100%;background:var(--accent)}
.status{font-size:12px;color:var(--muted)}
@media (max-width:560px){.brand h1{font-size:24px}.stat .v{font-size:24px}.deal .sides{grid-template-columns:1fr}.deal .arrow{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.chip-warn{border-color:#e0a84a;color:#f3d29a}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1}
.odds{display:flex;gap:16px}
.odds div{display:flex;flex-direction:column;align-items:flex-end}
.odds b{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--accent)}
.odds span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.vs .tn{font-weight:600;font-size:13px}
.vsx{font-family:var(--f-display);color:var(--muted);font-size:18px;padding-bottom:6px}
.wpbar{height:10px;border-radius:5px;background:var(--silver);overflow:hidden}
.wpbar.thin{height:6px}
.wpbar i{display:block;height:100%;background:var(--accent)}
.alerts{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.meter{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-right:6px;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--accent)}
.matchups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mu{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mu.mine{border-color:var(--accent);background:var(--accent-soft)}
.mu-r{display:flex;justify-content:space-between;gap:8px;font-size:13px}
[data-sub-panel][hidden]{display:none!important}
.feed{display:flex;flex-direction:column;gap:6px}
.al{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.al:last-child{border-bottom:0}
.al .tag{margin-top:1px}
.brief h4{font-family:var(--f-display);font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
.brief p{margin:2px 0}.brief ul{margin:2px 0;padding-left:18px}
.heat td.c{text-align:center;font-family:var(--f-mono);font-size:12px}
.heat .top{background:var(--good-soft);color:var(--good)}.heat .bot{background:var(--bad-soft);color:var(--bad)}
.tx{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.tx.mine{border-color:var(--accent)}
.tx-sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tx-side{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.flag{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--line);border-radius:6px}
.flag-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
textarea{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%;min-height:64px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-hdr{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:#5cb8ea;color:#0a1117;border:0;border-radius:3px;padding:3px 10px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:16px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(5,10,15,.55)}
.mgr{display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:13px}
.kv>span:nth-child(odd){color:var(--muted)}
.spark{vertical-align:middle}
/* manager layer */
.todo{border:1px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.todo h3{color:var(--warn)}
tr.cut td{border-bottom:2px dashed var(--accent)}
tr.cut-bye td{border-bottom:2px solid var(--good)}
.live{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;color:#fff;background:var(--bad);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:middle}
.pl{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pl:hover{text-decoration-color:var(--accent)}
.pl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:4px}
.gl div{border:1px solid var(--line);border-radius:4px;padding:4px;text-align:center;font-family:var(--f-mono);font-size:12px}
.gl div small{display:block;color:var(--muted);font-size:10px}
.gl .ct{background:var(--good-soft);border-color:var(--good)}
.gl .bye{color:var(--muted);background:var(--bg)}
.hole{color:var(--bad);font-weight:600}
/* plain-English layer */
.takeaway{background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:15px;line-height:1.5;max-width:none}
.takeaway b{color:var(--ink)}
.explain{font-size:12.5px;color:var(--muted);margin:2px 0 10px;max-width:90ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.guide dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px 14px;margin:0;font-size:13px}
.guide dt{font-weight:600}.guide dd{margin:0;color:var(--muted)}
.guide h4{font-family:var(--f-display);font-size:16px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
@media (max-width:560px){.guide dl{grid-template-columns:1fr}.guide dd{margin-bottom:6px}}
@media (max-width:560px){.tx-sides{grid-template-columns:1fr}}.bd-cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.vr>span:first-child{min-width:0;overflow-wrap:anywhere}@media (max-width:420px){.bd-cols{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card>h2{font-size:21px}
.answer{font-size:16px;line-height:1.5;margin:0;max-width:75ch}
.sub{font-size:13px;color:var(--muted);margin:0}
.word{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.w-good{background:var(--good-soft);color:var(--good)}.w-mid{background:var(--warn-soft);color:var(--warn)}.w-bad{background:var(--bad-soft);color:var(--bad)}.w-info{background:var(--accent-soft);color:var(--accent)}.w-plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.lg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.lg{display:flex;flex-direction:column;gap:10px}
.lg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lg-h a{font-weight:600;color:var(--accent);text-decoration:none;font-size:13px;white-space:nowrap}
.lg-h a:hover{text-decoration:underline}
.vsrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.vsrow .nm{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.vsrow .sc{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1}
.kvs{display:flex;gap:16px;flex-wrap:wrap}
.kvs div{display:flex;flex-direction:column}
.kvs b{font-family:var(--f-display);font-size:22px;line-height:1}
.kvs span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.li:last-child{border-bottom:0}
.li .main{display:flex;flex-direction:column;gap:3px;min-width:0}
.li .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.li .why{font-size:13px;color:var(--muted)}
.chip-l{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:3px;margin:1px 4px 1px 0;background:var(--bg);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.chip-l.st{border-color:var(--accent);color:var(--accent)}
.todo{border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.todo h2{font-size:18px;color:var(--warn)}
.todo ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pos.K{background:#6b7a3a}.pos.DEF{background:#5a5f66}
.switch{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.switch a{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:#cfe0ea;text-decoration:none;padding:3px 10px}
.switch a[aria-current="page"]{background:#5cb8ea;color:#0a1117}
.news a{color:var(--ink);font-weight:600;text-decoration:none}
.news a:hover{text-decoration:underline}
details.more{border-top:1px solid var(--line);padding-top:10px}details.more>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.footer{font-size:12px;color:var(--muted);padding:24px 0 8px}
@media (max-width:560px){.li{grid-template-columns:minmax(0,1fr)}.li .right{align-items:flex-start;text-align:left}.vsrow .sc{font-size:28px}}
.wpbar{cursor:help}.wpcap{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:3px}.wpcap b{color:var(--ink);font-weight:600}

/* ==========================================================================
   Theme: "sideline" — loaded last on every page.
   Chalk paper, ink type, turf green for you, penalty-flag yellow for things to act on.
   One family (Archivo), width axis does the work: wide for headings, normal for text.
   The one loud element is the field bar: win chance drawn as a football field.
   ========================================================================== */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#172026; --muted:#5d6a70; --line:#dde2de; --line2:#c9d0cb;
  --accent:#1d6a45; --accent-ink:#ffffff; --accent-soft:#e3efe7;
  --good:#1d6a45; --good-soft:#e3efe7;
  --bad:#b5412d; --bad-soft:#f7e3dd;
  --warn:#8a6400; --flag:#e9b31b; --warn-soft:#fbf2d3;
  --opp:#aab3b8; --ball:#8a4b25;
  --s1:#1d6a45; --s2:#c4801b; --silver:#aab3b8;
  --f-display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Archivo',system-ui,sans-serif;
  --r-lg:14px; --r-md:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#161e1a; --ink:#e6ece8; --muted:#97a59d; --line:#26312b; --line2:#34413a;
  --accent:#4fb882; --accent-ink:#0b1410; --accent-soft:#183326;
  --good:#4fb882; --good-soft:#183326; --bad:#e8735c; --bad-soft:#3a1d17;
  --warn:#f0c449; --flag:#f0c449; --warn-soft:#30280f;
  --opp:#4a5650; --ball:#c47a45; --s1:#4fb882; --s2:#e0a44a; --silver:#4a5650; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#161e1a; --ink:#e6ece8; --muted:#97a59d; --line:#26312b; --line2:#34413a;
  --accent:#4fb882; --accent-ink:#0b1410; --accent-soft:#183326;
  --good:#4fb882; --good-soft:#183326; --bad:#e8735c; --bad-soft:#3a1d17;
  --warn:#f0c449; --flag:#f0c449; --warn-soft:#30280f;
  --opp:#4a5650; --ball:#c47a45; --s1:#4fb882; --s2:#e0a44a; --silver:#4a5650; color-scheme:dark}

body{font-family:var(--f-body);font-size:15px;line-height:1.5;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{background:var(--panel)}
::selection{background:var(--accent-soft)}
a{color:var(--accent)}

/* ---------- type: sentence case everywhere, width carries the hierarchy ---------- */
h1,h2,h3,h4,.verdict,.verdict-h,.brief h4,.guide h4,.step,.word,.vtag,.tag,th,label.lab,.stat .k,.odds span,.kvs span,nav.tabs button,.switch a,.btn-hdr{text-transform:none!important;letter-spacing:0!important}
h2{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.005em!important}
h3{font-family:var(--f-display);font-stretch:108%;font-weight:650;font-size:16px;line-height:1.25}
.card>h2,.card>header h2{font-size:20px}
.num,.big,.big2,.sc,.t-big,.stat .v,.odds b,.kvs b,.verdict-h,.advice .stripe b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sub,.explain,.lede{color:var(--muted)}
.sub{font-size:13.5px}
.answer{font-size:16px}
.small{font-size:12.5px}
th{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line2);padding:8px}
td{padding:8px;border-bottom:1px solid var(--line)}
tr.hl td{background:var(--accent-soft)}
table{font-size:14px}
svg text{font-family:var(--f-body);font-size:10.5px}

/* ---------- app bar ---------- */
header.board{background:color-mix(in srgb,var(--panel) 92%,transparent);color:var(--ink);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
:root[data-theme="dark"] header.board{background:color-mix(in srgb,var(--panel) 92%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.board{background:color-mix(in srgb,var(--panel) 92%,transparent)}}
.board-in{padding-block:10px 0;gap:8px;max-width:1120px}
.wrap{max-width:1120px}
.brand{align-items:center}
.brand h1{font-family:var(--f-display);font-stretch:118%;font-size:22px;font-weight:800;letter-spacing:-.01em!important;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand h1::before{content:"";width:12px;height:22px;border-radius:3px;background:var(--accent);box-shadow:inset 0 -6px 0 rgba(255,255,255,.28);flex:none}
.brand h1 span{color:var(--muted);font-weight:500;font-stretch:100%}
.brand>.row{gap:8px!important}
.chips{gap:6px}
.chip{font-family:var(--f-body);font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:99px;padding:3px 10px}
.chip b{color:var(--ink);font-weight:650}
.chip-warn{border-color:var(--flag);color:var(--warn);background:var(--warn-soft)}

/* league switcher: the app-level control, so it sits apart and reads as one segmented pill */
.switch{border:1px solid var(--line);border-radius:99px;background:var(--bg);padding:3px;gap:2px}
.switch a{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);padding:5px 12px;border-radius:99px;text-decoration:none;transition:background .15s,color .15s}
.switch a:hover{color:var(--ink)}
.switch a[aria-current="page"]{background:var(--ink);color:var(--panel)}
.switch a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-hdr{font-family:var(--f-body);font-size:13px;font-weight:600;background:transparent;color:var(--ink);border:1px solid var(--line2);border-radius:99px;padding:5px 12px}
.btn-hdr:hover{border-color:var(--ink)}

/* section tabs */
nav.tabs{gap:4px;margin-top:2px;mask-image:linear-gradient(90deg,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
nav.tabs button{font-family:var(--f-body);font-size:14.5px;font-weight:600;color:var(--muted);padding:9px 10px 11px;border-bottom:2px solid transparent;border-radius:0}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}

main section{gap:18px;padding-top:22px}

/* ---------- surfaces ---------- */
.card,.panel,.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:none}
.tile,.stat,.mu,.tx,.deal,.flag,.bd-box{border-radius:var(--r-md);border-color:var(--line)}
.tile{background:var(--bg);border:0;padding:12px 14px}
.tile .t-label{font-size:13px}
.tile .t-big{font-size:32px;font-weight:750;font-stretch:105%;letter-spacing:-.02em}
.mu.mine,.tx.mine{border-color:var(--accent);background:var(--accent-soft)}
details.more{border-top:1px solid var(--line)}
details.more>summary{color:var(--accent);font-weight:600}
details.more>summary::before{content:"+ ";font-weight:700}
details.more[open]>summary::before{content:"– "}

/* ---------- pills, words, positions ---------- */
.word,.vtag{font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px}
.w-mid{background:var(--warn-soft);color:var(--warn)}
.pos{font-family:var(--f-body);font-size:11px;font-weight:700;border-radius:4px;padding:1px 0}
.pos.QB{background:#6c4aa8}.pos.RB{background:#16806f}.pos.WR{background:#2f6fb0}.pos.TE{background:#c0661b}
.live{font-family:var(--f-body);background:var(--bad);border-radius:99px;padding:0 7px;font-size:11px}

/* ---------- buttons & inputs ---------- */
.btn{font-family:var(--f-body);font-size:14px;font-weight:650;background:var(--accent);border:1px solid var(--accent);color:var(--accent-ink);border-radius:99px;padding:8px 16px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--accent)}
.seg,.tabsub{border-radius:99px}
.seg{border-color:var(--line);padding:2px;background:var(--bg)}
.seg button{border-radius:99px;background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tabsub button{border-radius:99px;font-size:13.5px}
.tabsub button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
select,input[type=search],input[type=text],input[type=number],textarea{border-radius:var(--r-sm);border-color:var(--line2);padding:8px 10px;background:var(--panel)}
.pick-list{border-radius:var(--r-md)}

/* ---------- "Do this": the flag ---------- */
.todo{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--flag);border-radius:var(--r-lg);padding:16px 20px}
.todo h2,.todo h3{color:var(--ink)}
.todo h2::after{content:"";display:inline-block;width:14px;height:10px;margin-left:8px;background:var(--flag);clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%);vertical-align:1px}
.todo ol{padding-left:22px;gap:8px}
.todo ol li::marker{font-weight:700;color:var(--muted)}
.advice{padding:22px 24px}
.advice .verdict-h{font-stretch:118%;font-size:36px;font-weight:800;letter-spacing:-.02em!important;text-transform:none!important}
.advice .move{border-left:4px solid var(--accent);border-radius:var(--r-md)}
.advice .move.todo{border-left-color:var(--flag)}
.advice ul{gap:7px}

/* ---------- the field bar: win chance as a football field ---------- */
.wpbar{position:relative;height:16px;border-radius:4px;background:var(--opp);overflow:visible;cursor:help;margin-top:4px}
.wpbar::before{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.55) calc(10% - 1px) 10%)}
.wpbar::after{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,rgba(0,0,0,.14) 0 5%,transparent 5% 95%,rgba(0,0,0,.14) 95%)}
.wpbar i{position:relative;display:block;height:100%;background:var(--accent);border-radius:4px 0 0 4px;z-index:1;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.wpbar i::after{content:"";position:absolute;right:-9px;top:50%;width:18px;height:11px;transform:translateY(-50%);border-radius:50%;z-index:3;
  background:var(--ball);box-shadow:0 0 0 2px var(--panel);
  background-image:linear-gradient(90deg,transparent 46%,rgba(255,255,255,.85) 46% 54%,transparent 54%)}
.wpbar.thin{height:8px}
.wpbar.thin i::after{display:none}
.wpcap{font-size:12px;margin-top:6px}
.wpcap b{font-weight:700}
@media (prefers-reduced-motion:reduce){.wpbar i{transition:none}}

/* scoreboard rows */
.vsrow .nm,.vs .tn{font-weight:650;font-size:14px}
.vsrow .sc{font-stretch:108%;font-weight:800;font-size:42px;letter-spacing:-.025em}
.vsx{font-family:var(--f-body);font-size:13px}
.kvs b,.odds b{font-stretch:105%;font-weight:750;color:var(--ink)}
.kvs span,.odds span{font-size:12px}

/* ---------- lists & tables ---------- */
.li{padding:12px 0}
.li .why{font-size:13.5px}
.vr>span:last-child{font-family:var(--f-body)}
.gl div{font-family:var(--f-body);border-radius:6px}
.bar2 .track,.needbar .bar,.meter{background:var(--line)}
.rng{background:var(--line)}
.lu .slot{font-family:var(--f-body);font-weight:600}
tr.chg td{background:var(--good-soft)}
.chip-l{border-radius:99px;padding:1px 8px;font-size:11.5px}
.takeaway{background:var(--accent-soft);border:0;border-radius:var(--r-md)}
.note{border-left-color:var(--line2)}
dialog{border-radius:var(--r-lg);padding:20px}
.footer{color:var(--muted)}

/* ---------- small screens ---------- */
@media (max-width:640px){
  .board-in{padding-top:8px}
  .brand{flex-direction:column;align-items:stretch;gap:8px}
  .brand h1{font-size:19px}
  .brand>.row{justify-content:space-between}
  .switch{order:-1;width:100%;justify-content:space-between}
  .switch a{flex:1;text-align:center;padding:6px 4px}
  .chips{order:2}
  .card,.panel,.todo{padding:16px}
  .advice{padding:18px}
  .advice .verdict-h{font-size:28px}
  .vsrow .sc{font-size:32px}
  nav.tabs button{font-size:14px;padding:8px 9px 10px}
}

/* ---------- league home: scoreboard first ---------- */
.scoreboard{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.scoreboard>.card{height:100%}
.lineup{border-left:6px solid var(--flag)}
.lineup h2{font-size:19px}
@media (max-width:860px){.scoreboard{grid-template-columns:minmax(0,1fr)}}
.tile .word{align-self:flex-start}
.scoreboard>.card{height:auto}
@media (max-width:640px){
  .brand>.row{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center}
  .brand>.row>.switch{grid-column:1/-1;grid-row:1}
  .brand>.row>.chips{grid-row:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .brand>.row>.chips::-webkit-scrollbar{display:none}
  .brand>.row>.btn-hdr{grid-row:2;grid-column:2}
}
/* hub: the week as a headline, not a card */
.hub-hero{padding:6px 2px 0}
.hub-hero h2{font-stretch:125%;font-size:46px;font-weight:800;letter-spacing:-.03em!important;line-height:1}
.hub-hero p{margin:6px 0 0;font-size:18px;color:var(--muted)}
@media (max-width:640px){.hub-hero h2{font-size:36px}.hub-hero p{font-size:16px}}
.brand h1 span{font-size:.72em;align-self:flex-end;margin-bottom:.18em}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.scoreboard .tiles{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.scoreboard .tile .t-big{font-size:28px}

/* ---------- folding cards: question + answer when closed ---------- */
.fold-head{cursor:pointer;-webkit-tap-highlight-color:transparent}
h2.fold-head,h3.fold-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fold-head:has(> .fold-btn){position:relative}
.fold-btn{flex:none;width:30px;height:30px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:inline-grid;place-items:center;padding:0;margin-left:auto;color:var(--muted)}
.fold-btn::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.fold-btn[aria-expanded="false"]::before{transform:translateY(1px) rotate(-45deg)}
.fold-btn:hover{color:var(--ink);border-color:var(--line2)}
.fold-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.folded{gap:6px;padding-top:14px;padding-bottom:14px}
.card.folded > *:not(.fold-head):not(.answer){display:none!important}
.card.folded > .answer ~ .answer{display:none!important}
.card.folded > .answer{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;color:var(--muted)}
.card.folded > .answer b{color:var(--ink)}
.card.folded > .fold-head .fold-btn{background:var(--panel)}
.card.folded .fold-head > :not(h2):not(h3):not(.fold-btn){display:none}
@media (prefers-reduced-motion:reduce){.fold-btn::before{transition:none}}
/* long lists and tables: first rows, then "Show all" */
.list.capped > :nth-child(n+6){display:none!important}
table.capped tbody tr:nth-child(n+13){display:none}
.more-btn{align-self:flex-start;font:inherit;font-size:13.5px;font-weight:650;color:var(--accent);background:transparent;border:1px solid var(--line2);border-radius:99px;padding:6px 14px;margin-top:6px;cursor:pointer}
.more-btn:hover{border-color:var(--accent)}
/* header: title scrolls away, tabs stay */
header.board{transition:none}

@media (max-width:560px){
  .li{grid-template-columns:minmax(0,1fr)!important;gap:6px}
  .li .right{flex-direction:row!important;align-items:center!important;justify-content:flex-start;flex-wrap:wrap;text-align:left!important;gap:8px}
}

p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;position:relative}
p.clamp.open{display:block;-webkit-line-clamp:unset}
p.clamp:not(.open)::after{content:"more";position:absolute;right:0;bottom:0;padding-left:28px;color:var(--accent);font-weight:650;background:linear-gradient(90deg,transparent,var(--panel) 26px)}
p.clamp:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (max-width:640px){.brand h1 span{display:none}.li .right .btn{padding:6px 12px;font-size:13px}}

<body>
<header class="board"><div class="board-in">
  <div class="brand"><h1>My leagues</h1>
    <div class="row" style="gap:8px"><div class="chips" id="chips"></div>
    <nav class="switch" aria-label="Switch league" id="lgSwitch"></nav><script>(function(){var L=[["Home","hub/"],["512",""],["Ring","ring/"],["Redraft","redraft/"]],p=location.pathname,m=p.match(/^(.*?\/)(ring|redraft|hub)\/(index\.html)?$/),root=m?m[1]:p.replace(/index\.html$/,''),cur=m?m[2]+'/':'';
document.getElementById('lgSwitch').innerHTML=L.map(function(x){return '<a href="'+root+x[1]+'"'+(x[1]===cur?' aria-current="page"':'')+'>'+x[0]+'</a>'}).join('')})()</script></div></div>
  <div style="height:10px"></div>
</div></header>
<main class="wrap"><section id="hub"><div class="card"><p class="sub">Loading your leagues…</p></div></section><div class="footer" id="foot"></div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=x=>x==null?'—':x>=0.995?'>99%':x<0.005&&x>0?'<1%':Math.round(x*100)+'%';
const fx=x=>x==null?'—':(+x).toFixed(1);
const posTag=p=>`<span class="pos ${p}" style="display:inline-block;width:30px">${p}</span>`;
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]+/g,' ').replace(/\b(jr|sr|ii|iii|iv|v)\b/g,'').replace(/\s+/g,' ').trim();
const ago=iso=>{const m=(Date.now()-Date.parse(iso))/6e4;return m<60?Math.max(1,Math.round(m))+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const LEAGUES=[{key:'512',label:'512 Best Ball',short:'512',url:'../',data:'../data.json',kind:'dyn'},
  {key:'ring',label:'Ring League',short:'Ring',url:'../ring/',data:'../ring/data.json',kind:'dyn'},
  {key:'redraft',label:'Fuller League',short:'Redraft',url:'../redraft/',data:'../redraft/data.json',kind:'red'}];
const SEV={Out:4,IR:4,PUP:4,Sus:4,Doubtful:3,Questionable:2};

// the blue bar in matchups: your share = your win chance (hover or read the caption under it)
const wpBar=(p,a,b,thin)=>{p=Math.max(0,Math.min(1,p||0));const tip=`Win chance: ${a} ${pct(p)}, ${b} ${pct(1-p)}. The green part of the field (where the ball sits) is ${a==='You'?'your':a+'\'s'} share, from 600 simulated games.`;
  return `<div class="wpbar${thin?' thin':''}" role="img" title="${esc(tip)}" aria-label="${esc(tip)}"><i style="width:${Math.round(p*100)}%"></i></div>${thin?'':`<div class="wpcap"><span><b>${pct(p)}</b> ${esc(a)} win</span><span>${esc(b)} <b>${pct(1-p)}</b></span></div>`}`};
// one common shape for every league
function summarize(L,d){const m=d.meta,me=m.me,P=d.players,tn=r=>(d.teams.find(t=>t.id===r)||{}).name||'Team '+r;
  const wk=m.this_week||m.cur,pr=(d.sched||{})[wk]||[],mid=(pr.find(x=>x[0]===me)||[])[1],opp=(pr.find(x=>x[1]===mid&&x[0]!==me)||[])[0];
  const mine=Object.keys(P).filter(s=>P[s].r===me&&!P[s].gone);let out;
  if(L.kind==='dyn'){const t=d.teams.find(x=>x.id===me),o=d.teams.find(x=>x.id===opp)||{};
    out={wk,w:t.w,l:t.l,name:t.name,odds:t.odds,proj:t.proj,live:t.live,wp:t.wp,oname:o.name,oproj:o.proj,olive:o.live,managed:!!(m.lu&&m.lu.managed),
      moves:(m.actions||[]).filter(x=>/^Set your lineup/.test(x)).concat((d.advice&&d.advice.moves||[]).map(x=>x.text).filter(Boolean)),headline:d.advice&&d.advice.headline,watch:(d.advice&&d.advice.watch||[]).map(x=>typeof x==='string'?x:x.text||''),
      role:s=>{const p=P[s];if(p.slot)return {txt:p.slot==='taxi'?'taxi':'IR',st:false};const imp=p.imp||0;return {txt:imp>=0.5?`${imp.toFixed(1)} pts/wk to your lineup`:'depth',st:imp>=1}},generated:m.generated}}
  else{const t=d.teams.find(x=>x.id===me),od=d.odds[me]||{},ss=d.startsit||{},best=new Set((ss.best||[]).filter(Boolean));
    out={wk,w:t.w,l:t.l,name:t.name,odds:{playoffs:od.playoffs,title:od.title},proj:(d.wk_mean[me]||[])[0],live:m.started?d.live[me]:null,wp:ss.wp_best??od.wp,
      oname:tn(ss.opp),oproj:ss.opp?(d.wk_mean[ss.opp]||[])[0]:null,olive:m.started&&ss.opp?d.live[ss.opp]:null,
      moves:(d.todo||[]).map(x=>x.text+(x.why?` (${x.why})`:'')),headline:null,watch:[],
      role:s=>P[s].ir?{txt:'IR',st:false}:best.has(s)?{txt:'starting this week',st:true}:{txt:'bench',st:false},generated:m.generated}}
  out.mine=mine;out.P=P;out.L=L;return out}

async function load(){const got=await Promise.all(LEAGUES.map(L=>fetch(L.data,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)));
  const S=LEAGUES.map((L,i)=>got[i]?summarize(L,got[i]):null).filter(Boolean);render(S);loadNews(S);loadTrending(S)}

function render(S){let h='';const fav=S.filter(s=>s.wp!=null&&s.wp>=0.5).length,wk=S[0]?S[0].wk:'';
  $('#chips').innerHTML=`<span class="chip">Week <b>${wk}</b></span>${S.map(s=>`<span class="chip">${esc(s.L.short)} <b>${s.w}-${s.l}</b></span>`).join('')}`;
  h+=`<div class="hub-hero"><h2>Week ${wk}</h2><p>${fav===S.length?`You're favored in all ${S.length} matchups.`:fav===0?`You're the underdog in all ${S.length} matchups.`:`You're favored in ${fav} of ${S.length} matchups.`}</p></div>`;
  // to-do across leagues
  const todo=[];S.forEach(s=>{s.moves.slice(0,2).forEach(t=>todo.push(`<li><span class="chip-l">${esc(s.L.short)}</span> ${esc(t)}</li>`))});
  const injStart=[];S.forEach(s=>s.mine.forEach(p=>{const x=s.P[p];if(SEV[x.inj]>=2&&s.role(p).st)injStart.push({s,p,x})}));
  injStart.filter(o=>SEV[o.x.inj]>=3).forEach(o=>todo.push(`<li><span class="chip-l">${esc(o.s.L.short)}</span> <b>${esc(o.x.n)}</b> is ${esc(o.x.inj.toLowerCase())}: ${o.s.L.kind==='red'||o.s.managed?'swap him out of your lineup':'best ball skips him, but your depth matters this week'}.</li>`));
  h+=todo.length?`<div class="todo"><h2>Do this</h2><ol>${todo.join('')}</ol></div>`:'';
  // league cards
  h+=`<div class="lg-grid">${S.map(s=>{const live=s.live!=null;const word=s.wp>=0.65?['w-good','Favored']:s.wp>=0.5?['w-info','Slight edge']:s.wp>=0.35?['w-mid','Underdog']:['w-bad','Big underdog'];
    return `<div class="card lg nofold"><div class="lg-h"><h2 style="font-size:19px">${esc(s.L.label)}</h2><a href="${s.L.url}">Open →</a></div>
    <div class="row"><span class="word ${word[0]}">${word[1]}</span>${live?'<span class="live">LIVE</span>':''}<span class="sub">${s.w}-${s.l}</span></div>
    <div class="vsrow"><div><div class="nm">${esc(s.name)}</div><div class="sc num">${fx(s.proj)}</div><div class="sub">${live?`<b>${fx(s.live)}</b> so far`:'projected'}</div></div><div class="muted" style="padding-bottom:6px">vs</div>
    <div style="text-align:right"><div class="nm">${esc(s.oname||'—')}</div><div class="sc num">${fx(s.oproj)}</div><div class="sub">${live?`<b>${fx(s.olive)}</b> so far`:'projected'}</div></div></div>
    ${wpBar(s.wp,'You',s.oname||'them')}
    <div class="kvs"><div><b>${pct(s.wp)}</b><span>win this week</span></div><div><b>${pct(s.odds.playoffs)}</b><span>playoffs</span></div><div><b>${pct(s.odds.title)}</b><span>title</span></div></div>
    ${live?`<p class="sub">Win chance as of the ${new Date(Date.parse(s.generated.replace('Z',':00Z'))).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} update. <a href="${s.L.url}">Open the league</a> for minute-by-minute numbers.</p>`:''}${s.moves[0]?`<p class="sub"><b>Top move:</b> ${esc(s.moves[0])}</p>`:''}</div>`}).join('')}</div>`;
  // injury report
  const inj={};S.forEach(s=>s.mine.forEach(p=>{const x=s.P[p];if(!x.inj)return;(inj[p]=inj[p]||{x,ls:[]}).ls.push({s,role:s.role(p)})}));
  const rows=Object.entries(inj).sort((a,b)=>(SEV[b[1].x.inj]||1)-(SEV[a[1].x.inj]||1)||(b[1].ls.some(l=>l.role.st)-a[1].ls.some(l=>l.role.st)));
  const what=x=>SEV[x.inj]>=4?'Won\'t play.':x.inj==='Doubtful'?'Unlikely to play: plan without him.':x.inj==='Questionable'?'Game-time call: the app re-checks when inactives come out (~90 min before kickoff).':'';
  const row=([p,o])=>{const x=o.x,d=x.injd||{};return `<div class="li"><div class="main"><div>${posTag(x.p)} <b>${esc(x.n)}</b> <span class="sub">${esc(x.t||'')}</span></div>
     <div class="why">${[d.injury_body_part,d.injury_notes,d.practice_participation?'practice: '+d.practice_participation:''].filter(Boolean).map(esc).join(' · ')}${d.injury_body_part||d.injury_notes?' · ':''}${what(x)}</div>
     <div>${o.ls.map(l=>`<span class="chip-l${l.role.st?' st':''}">${esc(l.s.L.short)}: ${esc(l.role.txt)}</span>`).join('')}</div></div>
     <div class="right"><span class="word ${SEV[x.inj]>=4?'w-bad':SEV[x.inj]===3?'w-bad':'w-mid'}">${esc(x.inj)}</span></div></div>`};
  const longT=r=>['IR','PUP','Sus'].includes(r[1].x.inj),now=rows.filter(r=>!longT(r)),lt=rows.filter(longT);
  h+=`<div class="card" data-fold-default="0"><h2>Injury report for your players</h2><p class="sub">This week's injury questions on any of your teams, worst first. Green-outlined tags mean he matters to that lineup.</p><div class="list">
   ${now.map(row).join('')||'<p class="sub">No game-week injury questions on your rosters right now.</p>'}</div>
   ${lt.length?`<details class="more"><summary>Long-term: ${lt.length} player${lt.length>1?'s':''} on IR or suspended</summary><div class="list">${lt.map(row).join('')}</div></details>`:''}</div>`;
  h+=`<div class="card" id="newsCard"><h2>News about your players</h2><p class="sub">Loading the latest from ESPN…</p></div>`;
  h+=`<div class="card" id="trendCard"><h2>Hot pickups you can get</h2><p class="sub">Loading…</p></div>`;
  // exposure
  const own={};S.forEach(s=>s.mine.forEach(p=>{(own[p]=own[p]||{x:s.P[p],ls:[]}).ls.push({s,role:s.role(p)})}));
  const multi=Object.values(own).filter(o=>o.ls.length>=2).sort((a,b)=>b.ls.length-a.ls.length);
  h+=`<div class="card"><h2>Players on more than one of your teams</h2><p class="sub">One injury or bad week hits several leagues at once. Good to know before you add more of the same player.</p><div class="list">
   ${multi.map(o=>`<div class="li"><div class="main"><div>${posTag(o.x.p)} <b>${esc(o.x.n)}</b> <span class="sub">${esc(o.x.t||'')}</span>${o.x.inj?` <span class="word w-mid">${esc(o.x.inj)}</span>`:''}</div><div>${o.ls.map(l=>`<span class="chip-l${l.role.st?' st':''}">${esc(l.s.L.short)}: ${esc(l.role.txt)}</span>`).join('')}</div></div><div class="right"><span class="num">${o.ls.length} teams</span></div></div>`).join('')||'<p class="sub">None: no player is on more than one of your teams.</p>'}</div></div>`;
  $('#hub').innerHTML=h;
  $('#foot').textContent='League data updated: '+S.map(s=>`${s.L.short} ${new Date(Date.parse(s.generated.replace('Z',':00Z'))).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}`).join(' · ')+'. News and trending pickups load live each time you open this page.'}

async function loadNews(S){const el=$('#newsCard');
  const names={};S.forEach(s=>s.mine.forEach(p=>{const x=s.P[p];const k=norm(x.n);(names[k]=names[k]||{x,ls:new Set()}).ls.add(s.L.short)}));
  try{const r=await Promise.all([fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100').then(x=>x.json())]);
    const arts=(r[0].articles||[]).map(a=>({a,hit:(a.categories||[]).filter(c=>c.type==='athlete').map(c=>names[norm(c.description)]).filter(Boolean)})).filter(o=>o.hit.length);
    el.innerHTML=`<h2>News about your players</h2><p class="sub">From ESPN's latest NFL news, filtered to players on your teams.</p><div class="list news">${arts.slice(0,20).map(({a,hit})=>`<div class="li"><div class="main"><a href="${esc(a.links&&a.links.web&&a.links.web.href||'#')}" target="_blank" rel="noopener">${esc(a.headline)}</a>${a.description&&a.description!==a.headline?`<span class="why">${esc(a.description)}</span>`:''}<div>${hit.map(h=>`<span class="chip-l">${esc(h.x.n)}: ${[...h.ls].map(esc).join(', ')}</span>`).join('')}</div></div><div class="right"><span class="sub">${ago(a.published)}</span></div></div>`).join('')||'<p class="sub">Nothing in the latest 100 stories mentions your players.</p>'}</div>`}
  catch(e){el.innerHTML=`<h2>News about your players</h2><p class="sub">Couldn't load ESPN news right now.</p>`}}

async function loadTrending(S){const el=$('#trendCard');
  try{const t=await fetch('https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=24&limit=60').then(x=>x.json());
    const rows=[];for(const it of t){const pid=String(it.player_id);let x=null;for(const s of S){if(s.P[pid]){x=s.P[pid];break}}if(!x||!['QB','RB','WR','TE'].includes(x.p))continue;
      const free=S.filter(s=>!(s.P[pid]&&s.P[pid].r));if(!free.length)continue;rows.push({x,free,n:it.count,pid})}
    el.innerHTML=`<h2>Hot pickups you can get</h2><p class="sub">The players Sleeper users added most in the last 24 hours who are free agents in at least one of your leagues.</p><div class="list">${rows.slice(0,10).map(r=>`<div class="li"><div class="main"><div>${posTag(r.x.p)} <b>${esc(r.x.n)}</b> <span class="sub">${esc(r.x.t||'')}</span>${r.x.inj?` <span class="word w-mid">${esc(r.x.inj)}</span>`:''}</div><div>${r.free.map(s=>`<a class="chip-l st" style="text-decoration:none" href="${s.L.url}">Free in ${esc(s.L.short)}</a>`).join('')}</div></div><div class="right"><span class="num sub">${r.n.toLocaleString()} adds</span></div></div>`).join('')||'<p class="sub">None of today\'s most-added players are available in your leagues.</p>'}</div>`}
  catch(e){el.innerHTML=`<h2>Hot pickups you can get</h2><p class="sub">Couldn't load Sleeper's trending list right now.</p>`}}
load();
</script>
<script>/* Less scrolling, on every page:
   1. Cards fold to their question and one-line answer. On each tab the first two cards start open, the rest folded;
      tap the title to open or close. Your choices are remembered on this device.
   2. Long lists and tables show the first rows with a "Show all" button.
   3. On scroll, the title and league switcher slide away; the section tabs stay pinned. */
(function(){
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const PAGE=location.pathname.replace(/index\.html$/,'');
  const OPEN_N=2,LIST_SHOW=5,LIST_MIN=7,ROWS_SHOW=12,ROWS_MIN=16;
  const keyOf=(card,head)=>'fold:'+PAGE+':'+(card.id||((head.querySelector('h2,h3')||head).textContent||'').replace(/\d+/g,'#').trim().slice(0,40));
  function headOf(card){const c=card.firstElementChild;if(!c)return null;
    if(/^H[23]$/.test(c.tagName)||c.tagName==='HEADER')return c;
    if(c.querySelector&&c.querySelector(':scope > h2, :scope > h3, :scope > div > h2, :scope > div > h3'))return c;return null}
  function sectionCards(sec){return [...sec.querySelectorAll('.card')].filter(c=>!c.hidden&&!c.closest('dialog')&&!c.classList.contains('nofold')&&!c.hasAttribute('aria-live')&&!c.matches('details')&&headOf(c)&&!(c.parentElement&&c.parentElement.closest('.card')))}
  function setFold(card,folded){card.classList.toggle('folded',folded);const b=card.querySelector(':scope > * .fold-btn, :scope > .fold-btn');if(b){b.setAttribute('aria-expanded',String(!folded));b.title=folded?'Show':'Hide'}}
  function prepCard(card,idx){const head=headOf(card);if(!head)return;
    card.classList.add('foldable');
    if(!head.querySelector('.fold-btn')){const b=document.createElement('button');b.type='button';b.className='fold-btn';b.setAttribute('aria-label','Show or hide this section');head.appendChild(b)}
    head.classList.add('fold-head');
    const k=keyOf(card,head);card.dataset.foldKey=k;
    const saved=store.get(k);
    const want=saved!=null?saved==='1':(card.dataset.foldDefault?card.dataset.foldDefault==='1':idx>=OPEN_N);
    if(card.dataset.foldInit!==k){card.dataset.foldInit=k;setFold(card,want)}else setFold(card,card.classList.contains('folded'))}
  function capLists(root){
    root.querySelectorAll('.list').forEach(l=>{const n=l.children.length-(l.nextElementSibling&&l.nextElementSibling.classList.contains('more-btn')?0:0);
      const items=[...l.children].filter(x=>!x.classList.contains('more-btn'));
      if(items.length>=LIST_MIN&&!l.dataset.capped){l.dataset.capped='1';l.classList.add('capped');
        const b=document.createElement('button');b.type='button';b.className='more-btn';b.dataset.n=items.length;b.textContent=`Show all ${items.length}`;l.after(b)}
      else if(items.length<LIST_MIN&&l.dataset.capped){l.classList.remove('capped');delete l.dataset.capped;const b=l.nextElementSibling;if(b&&b.classList.contains('more-btn'))b.remove()}
      else if(l.dataset.capped){const b=l.nextElementSibling;if(b&&b.classList.contains('more-btn')&&+b.dataset.n!==items.length){b.dataset.n=items.length;if(l.classList.contains('capped'))b.textContent=`Show all ${items.length}`}}});
    root.querySelectorAll('table').forEach(t=>{const tb=t.tBodies[0];if(!tb||t.closest('.lu')||t.classList.contains('nocap'))return;const n=tb.rows.length;const w=t.closest('.tbl-wrap')||t;
      if(n>=ROWS_MIN&&!t.dataset.capped){t.dataset.capped='1';t.classList.add('capped');const b=document.createElement('button');b.type='button';b.className='more-btn';b.dataset.n=n;b.textContent=`Show all ${n} rows`;w.after(b)}
      else if(t.dataset.capped){const b=w.nextElementSibling;if(b&&b.classList.contains('more-btn')&&+b.dataset.n!==n){b.dataset.n=n;if(t.classList.contains('capped'))b.textContent=`Show all ${n} rows`}}})}
  // long explanations: two lines, tap to read the rest
  function clampSubs(root){root.querySelectorAll('.card > p.sub, .card > div > p.sub, .card > .explain').forEach(p=>{
    if(p.dataset.cl)return;if((p.textContent||'').length<170){p.dataset.cl='0';return}
    p.dataset.cl='1';p.classList.add('clamp');p.setAttribute('role','button');p.tabIndex=0;p.title='Tap to read more'})}
  let busy=false;
  function run(){if(busy)return;busy=true;
    try{document.querySelectorAll('main section, main#hub, main > section, #hub').forEach(sec=>{sectionCards(sec).forEach((c,i)=>prepCard(c,i))});capLists(document);clampSubs(document)}finally{setTimeout(()=>{busy=false},0)}}
  let t=null;const mo=new MutationObserver(()=>{clearTimeout(t);t=setTimeout(run,60)});
  mo.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('click',e=>{
    const cp=e.target.closest('p.clamp');if(cp&&!e.target.closest('a,button,.pl')){cp.classList.toggle('open');return}
    const mb=e.target.closest('.more-btn');
    if(mb){const tgt=mb.previousElementSibling;const el=tgt&&(tgt.matches('table,.list')?tgt:tgt.querySelector('table'));if(!el)return;
      const on=el.classList.toggle('capped');mb.textContent=on?(el.matches('table')?`Show all ${mb.dataset.n} rows`:`Show all ${mb.dataset.n}`):'Show fewer';
      if(on)mb.previousElementSibling.scrollIntoView({block:'nearest'});return}
    const head=e.target.closest('.fold-head');if(!head)return;
    if(e.target.closest('a,select,input,textarea,label,button:not(.fold-btn),.pl,.word'))return;
    const card=head.closest('.card.foldable');if(!card||card.parentElement.closest('.card'))return;
    const f=!card.classList.contains('folded');setFold(card,f);store.set(card.dataset.foldKey,f?'1':'0');
    if(!f){const r=card.getBoundingClientRect();if(r.top<0)card.scrollIntoView({block:'start'})}});
  // open a folded card when something inside it is jumped to (e.g. a "Check this trade" button shows the lab)
  window.uxOpen=sel=>{const c=document.querySelector(sel);if(c&&c.classList.contains('folded'))setFold(c,false)};
  // header: title and switcher scroll away, tabs stay pinned
  function pin(){const h=document.querySelector('header.board'),tabs=h&&h.querySelector('nav.tabs');if(!h)return;
    const off=tabs?h.offsetHeight-tabs.offsetHeight-2:0;h.style.top=`calc(env(safe-area-inset-top,0px) - ${Math.max(0,off)}px)`}
  window.addEventListener('resize',pin);document.addEventListener('DOMContentLoaded',()=>{pin();run()});setTimeout(()=>{pin();run()},300);
  if(document.readyState!=='loading'){pin();run()}
})();
</script>
