name: Refresh data
on:
  schedule:
    - cron: "23 */3 * * *"      # every 3 hours (odd minute: GitHub drops fewer runs off the top of the hour)
    - cron: "7,37 16-23 * * 0"  # every 30 min during Sunday afternoon games (UTC)
    - cron: "7,37 0-4 * * 1,2,5" # Sunday, Monday and Thursday night games (late evening US = early morning UTC)
    - cron: "40 13 * * 2"       # Tuesday morning: weekly digest
    - cron: "43 15,16 * * 0"    # Sunday ~11:40am ET: inactives for the early games are out (two hours cover daylight saving)
    - cron: "52 22,23 * * 1,4"  # Monday and Thursday ~6:50pm ET: inactives for the night game
  push:                          # refresh right away whenever the app's code or settings change
    branches: [main]
    paths: ["pipeline/**", "scripts/**", "config.json", "docs/index.html", "docs/redraft/index.html", "docs/ring/index.html", ".github/workflows/refresh.yml"]
  workflow_dispatch:
    inputs:
      digest:
        description: "Post the weekly digest now"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: cache
          key: sleeper-cache-${{ github.run_id }}
          restore-keys: sleeper-cache-
      - name: Build all leagues, commit, alert
        run: bash scripts/refresh_once.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: lets Claude write the recommendation
      - name: Weekly digest
        if: github.event.schedule == '40 13 * * 2' || inputs.digest
        run: gh issue create --title "Weekly digest · $(date -u +%b\ %d)" --body-file docs/digest.md
